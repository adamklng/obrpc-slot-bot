name: Check OBRPC slots

on:
  schedule:
    # Off-peak minutes: GitHub delays/drops many runs scheduled at :00/:15/:30/:45.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: slot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # state.json remembers which slots were already alerted on, so you only get pinged once per opening.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check slots
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
